name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build frontend
        env:
          BASE_PATH: /wodvault/
        run: |
          deno task bootstrap
          deno task build:frontend

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './static'

      - name: Cleanup static files
        run: |
          find ./static -type f -name "*.min.js" -delete
          find ./static -type f -name "*.min.js.map" -delete
          find ./static -type f -name "index.html" -delete
          find ./static -type d -name "vendor" -prune -exec rm -rf {} +

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
